<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle with Subtle Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#bgGrad)" filter="url(#subtleShadow)" />

  <!-- Subtle Top Gloss Highlight -->
  <rect x="24" y="24" width="464" height="232" rx="116" ry="116" fill="url(#shineGrad)" />

  <!-- Centered Lucide-style Film Reel Icon -->
  <g transform="translate(116, 116) scale(11.666)" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Film Frame -->
    <rect x="3" y="3" width="18" height="18" rx="2.5" />
    <!-- Vertical Film Strips -->
    <path d="M7 3v18" />
    <path d="M17 3v18" />
    <!-- Horizontal Center Divider -->
    <path d="M3 12h18" />
    <!-- Sprocket Hole Notches -->
    <path d="M3 7.5h4" />
    <path d="M3 16.5h4" />
    <path d="M17 7.5h4" />
    <path d="M17 16.5h4" />
  </g>
</svg>
